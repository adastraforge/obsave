name: Release ObSave

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build
        env:
          OBSAVE_GOOGLE_CLIENT_ID: ${{ secrets.OBSAVE_GOOGLE_CLIENT_ID }}
          OBSAVE_GOOGLE_CLIENT_SECRET: ${{ secrets.OBSAVE_GOOGLE_CLIENT_SECRET }}

      - name: Verify build artifacts
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          node -e "const m=require('./manifest.json'); if(!m.version) process.exit(1); console.log('Version:', m.version)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
